<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Defense-in-depth: no remote scripts can load even if markup is injected.
         'unsafe-inline' is required by the theme pre-paint script below and
         Vite's dev preamble; data:/blob: cover stored attachments (previews +
         the viewer); ws: covers dev HMR; fonts.g* are the only remote hosts. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' data: blob:; object-src 'self' data:; frame-src 'self' data: blob:; connect-src 'self' ws: wss:; base-uri 'self'; form-action 'self'" />
    <script>
      /* Pre-paint theme: apply the saved theme before React mounts so the page
         doesn't flash the default theme on reload. Mirrors src/data/storage.ts
         (STORAGE_KEY = "ledger-state-v1") and the Settings["theme"] union — keep
         the key and the theme list below in sync with those. Falls back to the
         static data-theme="dark" on <html> when storage is empty or corrupt. */
      (function () {
        try {
          var raw = localStorage.getItem("ledger-state-v1");
          if (!raw) return;
          var theme = JSON.parse(raw).settings.theme;
          if (["dark", "light", "carbon", "sand"].indexOf(theme) !== -1) {
            document.documentElement.setAttribute("data-theme", theme);
          }
        } catch (e) {
          /* keep the default data-theme="dark" */
        }
      })();
    </script>
    <title>Ledger — Expense Tracker</title>
    <meta name="theme-color" content="#4f8ff7" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
